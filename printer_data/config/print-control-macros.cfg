#         G1 X{start_x + wipe_dist_x} Y{start_y +  wipe_dist_y} F{wipe_spd * 60}
#         # Wisch zurück nach links
#         G1 X{start_x} Y{start_y} F{wipe_spd * 60}
#     {% endfor %}

#     # Nach dem Wischen den Kopf anheben
#     G1 Z{start_z + 10} F3000

#====================================================================
# DUMMY MACROS
#====================================================================
[gcode_macro M142]
gcode:
    # Safely ignore Bambu/Prusa chamber cooling commands

[gcode_macro m141]
description: Sets chamber temperature.
  Usage: M141 [S<temp>]
gcode:
  SET_HEATER_TEMPERATURE_SCALED HEATER=chamber TARGET={params.S|default(0)}
