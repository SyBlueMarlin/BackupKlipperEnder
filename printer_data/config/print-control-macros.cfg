#====================================================================
# RATRIG 400MM - CUSTOM START & END G-CODE (CARTOGRAPHER TOUCH)
#====================================================================

#slicer: START_PRINT BED_TEMP=[first_layer_bed_temperature] EXTRUDER_TEMP=[first_layer_temperature]
#        END_PRINT

[gcode_macro START_PRINT]
description: Startprozedur
gcode:
	LED_HEATING
    # Slicer Parameter holen
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
    
    M117 Heize Bett auf {BED_TEMP}C...
    M140 S{BED_TEMP}         # Bett-Heizung starten
    M104 S150                # Düse auf 150°C vorheizen (verhindert Oozing, schützt das PEI-Blech beim Touch)

    LED_LEVELING
    # Sicherstellen, dass die Achsen gehomed sind
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

    # 2. Düsenreinigung aufrufen
    #CLEAN_NOZZLE
    
    M190 S{BED_TEMP}         # Warten bis Bett voll aufgeheizt ist
    
    #M117 Führe Z-Tilt aus...
    #Z_TILT_ADJUST      # Richtet die 3 Z-Achsen aus (nutzt die in der z_tilt konfigurierte Methode)

    M117 Erstelle Bed Mesh...
    #BED_MESH_CALIBRATE METHOD=scan # Nutzt den ultraschnellen Cartographer-SCAN für das Bett-Profil

    #EXCLUDE_OBJECT_DEFINE # JP 11.09.26
    #BED_MESH_CALIBRATE ADAPTIVE=1
    BED_MESH_CALIBRATE METHOD=rapid_scan ADAPTIVE=1

    # Bettmitte anfahren für das finale, hochpräzise Touch-Homing
    #G0 X200 Y200 F6000
    #M117 Führe Cartographer Touch aus...
    #CARTOGRAPHER_TOUCH       # Die Düse tastet das heiße Bett physisch ab und setzt den Z-Nullpunkt perfekt!
    #CARTOGRAPHER_TOUCH_HOME

    # Kopf für finale Hotend-Heizung parken (Vorne Links)
    G1 X10 Y10 Z10 F6000

    LED_HEATING_EX
    M117 Heize Extruder auf {EXTRUDER_TEMP}C...
    M109 S{EXTRUDER_TEMP}    # Warten auf finale Drucktemperatur
    
    # Düsenreinigungs-Linie (Prime Line) vor dem Druckstart
    M117 Drucke Prime-Line...
    G92 E0
    G1 Z0.3 F1200
    G1 X100 E15 F1500        # Erste Linie ziehen
    G1 Y12 F5000             # Leicht versetzen
    G1 X20 E15 F1500         # Zurückziehen
    G92 E0
    LED_PRINTING
    M117 Druck gestartet!


#====================================================================
# RATRIG 400MM - CUSTOM END PRINT MACRO
#====================================================================

[gcode_macro END_PRINT]
description: Beendet den Druck sicher, entlastet den Extruder und schaltet CPAP aus
gcode:
    # Puffer leeren, um sicherzustellen, dass alle Bewegungen abgeschlossen sind
    M400                     
    
    # Relative Positionierung für sicheres Freifahren
    G91                      
    
    # Filament leicht zurückziehen (Retract), um Oozing/Fäden zu verhindern
    # 4mm Rückzug ist optimal für den Orbiter 2.1 bei Direct-Drive
    G1 E-4 F3000             
    
    # Bett um 15mm absenken (Z-Achse fährt nach unten), um die Düse vom Bauteil zu trennen
    G1 Z15 F3000             
    
    # Zurück zu absoluter Positionierung
    G90                      
    
    # Kopf sicher auf dem großen 400mm Bett parken (Hinten Links)
    # X=10 (Sicherheitsabstand links), Y=390 (Sicherheitsabstand hinten vor dem Rahmen)
    G1 X10 200 F6000
    
    # Heizelemente ausschalten
    TURN_OFF_HEATERS
    
    # CPAP Bauteillüfter komplett ausschalten
    M107                     
    
    # Motoren stromlos schalten (Bett bleibt dank der 3 Spindeln stabil)
    M84                      
    LED_FINISHED
    M117 Druck erfolgreich beendet!

[gcode_macro CANCEL_PRINT]
description: Bricht den aktuellen Druck ab
rename_existing: CANCEL_PRINT_BASE
gcode:
  LED_ERROR
  TURN_OFF_HEATERS
  M107
  G91
  G1 Z10 F3000
  G90
  G1 X10 Y200 F6000
  CANCEL_PRINT_BASE

# [gcode_macro CLEAN_NOZZLE]
# variable_start_x: 1         # Start-X-Koordinate des Pads
# variable_start_y: 189       # Start-Y-Koordinate des Pads
# variable_start_z: 3.687     # Höhe, bei der die Düse das Pad berührt
# variable_wipe_dist_x: 2     # Wie weit sich der Kopf auf X hin- und herbewegen soll
# variable_wipe_dist_y: 25    # Optionaler Versatz auf Y pro Wisch
# variable_wipe_qty: 5        # Wie oft hin und her gewischt wird
# variable_wipe_spd: 200      # Wischgeschwindigkeit (in mm/s)

# gcode:
#     {% if "xyz" not in printer.toolhead.homed_axes %}
#         G28                 # Homen, falls noch nicht geschehen
#     {% endif %}

#    	M104 S150               # Düse auf 150°C vorheizen (verhindert Oozing, schützt das PEI-Blech beim Touch)
#     M109					# wait for the temperatur JP 14.08.2026
#     G90                     # Absolute Positionierung
    
#     # Sicher über das Pad fahren
#     G1 Z{start_z + 10} F3000
#     G1 X{start_x} Y{start_y} F12000
#     # Auf Wischhöhe absenken
#     G1 Z{start_z} F1500

#     # Wischschleife
#     {% for i in range(1, wipe_qty + 1) %}
