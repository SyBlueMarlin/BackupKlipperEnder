# Configuration for DIY MMU3 based on SKR-MINI
#
# Based on the great work of Jeremy Briffaut kakou@kakou.org
#
# More info : https://www.thingiverse.com/thing:3910546
#
# config inspired from https://github.com/mwr666/klipper/blob/sunbeam2.0c_multi_mcu_mmu2/config/printer-protodev-corexy-multi-mcu-mmu2.cfg
#

[include mmu3_menus.cfg]
[include beep.cfg]


[gcode_macro T0]
#rename_existing: T0.1
variable_active: True
variable_color: "7bff33"                                  # Used in frontends
variable_hotend_type: "SF"
variable_has_cht_nozzle: False
variable_cooling_position_to_nozzle_distance: 40          # heatbreak length from cold zone to nozzle
variable_tooolhead_sensor_to_extruder_gear_distance: 15   # distance in mm from the sensor to the extruder gear
variable_extruder_gear_to_cooling_position_distance: 30   # distance in mm from the extruder gear to the end of the hotend cold zone
variable_filament_loading_nozzle_offset: -5
variable_filament_grabbing_length: 5
variable_filament_grabbing_speed: 1
variable_enable_insert_detection: True                    # enables filament sensor insert detection 
variable_enable_runout_detection: True                    # enables filament sensor runout detection 
variable_enable_clog_detection: True                      # enables filament sensor clog detection 
variable_unload_after_runout: True                        # unload filament after a runout has been detected
variable_purge_after_load: 0
variable_purge_before_unload: 0
variable_extruder_load_speed: 60
variable_filament_load_speed: 10
variable_standby: False
variable_temperature_offset: 0                            # hotend temperature offset
variable_has_oozeguard: False                             # toolhead has a oozeguard
variable_has_front_arm_nozzle_wiper: False                # toolhead has front arm nozzle wipers
variable_resume_after_insert: False                       # resumes the print after inserting new filament
gcode:
	PT0

[gcode_macro T1]
#rename_existing: T1.1
variable_active: True
variable_color: "7bff33"                                  # Used in frontends
variable_hotend_type: "SF"
variable_has_cht_nozzle: False
variable_cooling_position_to_nozzle_distance: 40          # heatbreak length from cold zone to nozzle
variable_tooolhead_sensor_to_extruder_gear_distance: 15   # distance in mm from the sensor to the extruder gear
variable_extruder_gear_to_cooling_position_distance: 30   # distance in mm from the extruder gear to the end of the hotend cold zone
variable_filament_loading_nozzle_offset: -5
variable_filament_grabbing_length: 5
variable_filament_grabbing_speed: 1
variable_enable_insert_detection: True                    # enables filament sensor insert detection 
variable_enable_runout_detection: True                    # enables filament sensor runout detection 
variable_enable_clog_detection: True                      # enables filament sensor clog detection 
variable_unload_after_runout: True                        # unload filament after a runout has been detected
variable_purge_after_load: 0
variable_purge_before_unload: 0
variable_extruder_load_speed: 60
variable_filament_load_speed: 10
variable_standby: False
variable_temperature_offset: 0                            # hotend temperature offset
variable_has_oozeguard: False                             # toolhead has a oozeguard
variable_has_front_arm_nozzle_wiper: False                # toolhead has front arm nozzle wipers
variable_resume_after_insert: False                       # resumes the print after inserting new filament
gcode:
	PT1

########################################
#
# Configuration for a SKR MINI e3 v3 board with 3 TMC2209 UART
# and 2 1.7A stepper motor at 1/16
# current for a 24V power
#
########################################
[mcu mmboard]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_2800160007504E5238363120-if00

[respond]
default_type: command

# E0 : MMU3 5mm road with the 5 gears
[manual_stepper pulley_stepper]
step_pin: mmboard:PB3
dir_pin: mmboard:PB4
enable_pin: !mmboard:PD1
microsteps: 16
#rotation_distance: 22.857
rotation_distance: 18.286 # JP calibrated
velocity: 20
accel: 10
endstop_pin: ^mmboard:PC15

[tmc2209 manual_stepper pulley_stepper]
uart_pin: mmboard:PC11
tx_pin: mmboard:PC10
uart_address: 3
#run_current: 0.650 #JP
run_current: 0.5
sense_resistor: 0.110

# Y : MMU3 idler with the 5 ball bearings
[tmc2209 manual_stepper idler_stepper]
uart_pin: mmboard:PC11
tx_pin: mmboard:PC10
uart_address: 2
#run_current: 0.580 #JP
run_current: 0.45
sense_resistor: 0.110
stealthchop_threshold: 999999
diag_pin: ^mmboard:PC1
driver_SGTHRS: 128

[manual_stepper idler_stepper]
step_pin: mmboard:PB10
dir_pin: mmboard:PB2
enable_pin: !mmboard:PB11
microsteps: 16
rotation_distance: 128
velocity: 100
accel: 80
endstop_pin: tmc2209_idler_stepper:virtual_endstop

# X : MMU3 selector
[tmc2209 manual_stepper selector_stepper]
uart_pin: mmboard:PC11
tx_pin: mmboard:PC10
uart_address: 0
#run_current: 0.580 #JP
run_current: 0.45
sense_resistor: 0.110
stealthchop_threshold: 999999
diag_pin: ^mmboard:PC0
driver_SGTHRS: 96

[manual_stepper selector_stepper]
step_pin: mmboard:PB13
dir_pin: mmboard:PB12
enable_pin: !mmboard:PB14
# 80 step/mm
microsteps: 16
rotation_distance: 8
velocity: 30
accel: 200
endstop_pin: tmc2209_selector_stepper:virtual_endstop


# IR
# [filament_switch_sensor ir_sensor]
# pause_on_runout: False
# switch_pin: !P1.28 # P1.28 for X-max

################################
#
#  PARAMETER TO ADAPT TO YOUR SETUP

# ================
# Timeouts
# timeout_pause  : timeout of the MMU3 pause when user intervention is needed
# disable_heater : timeout of the heater during pause (temperature is saved and
#                  restored before resuming).

# ================
# Pulley Stepper Settings
# Bowden
# Load Settings
# bowden_load_length1 : length of the bowden between the selector and the entry
#                       of the extruder (quick MOVE).
# bowden_load_length2 : length of the bowden between the entry of the extruder
#                       and the extruder gear (slow MOVE).
# bowden_load_speed1  : speed to use when loading from finda to the extruder,
#                       this is the speed used during the majority of the load
#                       movement.
# bowden_load_speed2  : speed to use when loading from finda to the extruder,
#                       this is the speed used during the second and smaller
#                       push to the gears.
# bowden_load_accel1  : accel to use when loading from finda to the extruder,
#                       this is the acceleration used during the majority of
#                       the load movement.
# bowden_load_accel2  : accel to use when loading from finda to the extruder,
#                       this is the acceleration used during the push to the
#                       gears.
# pulley_load_to_extruder_speed : the speed used when loading the filament to
#                                the extruder.

# Unload Settings
# bowden_unload_length : length between the the extruder gear and the FINDA
# bowden_unload_speed  : speed value used while unloading the filament from
#                        extruder to finda.
# bowden_unload_accel  : acceleration value used while unloading the filament
#                        from extruder to finda.

# ================
# FINDA
# finda_load_retry     : The number of retries before pausing when loading the
#                        filament to FINDA, defaults to 20.
# finda_load_length    : length of filament to be used when loading from
#                        filament buffer. to FINDA, this will cancel early if
#                        the filament is already inside the MMU unit, defaults
#                        to 120 mm.
# finda_unload_length  : length to retract the filament into the MMU3 from the
#                        FINDA during unloading, defaults to 30 mm.
# finda_load_speed     : load speed to be used when loading the filament to
#                        FINDA, defaults to 80 mm/s.
# finda_unload_speed   : 20
# finda_load_accel     : 50
# finda_unload_accel   : 50

# ================
# Cut length and other settings (Not used with MMU3-12x)
# cut_filament_length  : the length of filament to be cut, defaults to 20 mm.
# cutting_edge_retract : the length of filament to be retracted after the cut,
#                        defaults to 5 mm.
# cut_stepper_current  : the stepper current to be used when cutting, defaults
#                        to 1.0 amp.

# ================
# Selector
# selector_speed        : the normal operation speed of the selector, defaults
#                         to 45 mm/s.
# selector_homing_speed : the homing speed of the selector, defaults to 30 mm/s.
# selector_positions    : the 5 positions of the selector.

# ================
# Idler
# idler_positions              : the 5 positions of the idler bearing ball
# idler_home_position          : the homing position of the idler
# idler_homing_speed           : the homing speed of the idler.
# idler_homing_accel           : the homing acceleration of the idler.
# idler_speed                  : the normal operation speed of the idler.
# idler_accel                  : the normal operation acceleration of the idler.

# ================
# Pause values
# pause_before_disabling_steppers : pause before disabling the steppers,
#                                   required to prevent mcu errors, defaults to
#                                   50 ms.
# pause_after_disabling_steppers  : pause after disabling the steppers,
#                                   required to prevent mcu errors, defaults to
#                                   200 ms.
# pause_position                  : x, y, z position when MMU3 need intervention
#                                   and the printer is paused, defaults to
#                                   230, 220, 10.

# ================
# Temperature
# min_temp_extruder       : minimal required heater temperature to load/unload
#                           filament from the extruder gear to the nozzle.
# extruder_eject_temp     : heater temperature used to eject filament during
#                           home if the filament is already loaded.
# enable_no_selector_mode : pass from MMU3 standard (0) to MMU3-No_Selector
#                           mode with splitter.

################################

# enable MMU3 extension
[mmu3 MMU3]
# timeouts
timeout_pause: 86400
disable_heater: 600

# --------------------------------------
# Pulley Stepper Parameters
pulley_load_to_extruder_speed: 40 # 10

# bowden load
bowden_load_length1: 420 #JP
bowden_load_length2: 20
bowden_load_length3: 20
bowden_load_speed1: 120
bowden_load_speed2: 60
bowden_load_accel1: 80
bowden_load_accel2: 80
# bowden unload
bowden_unload_length: 430 #JP
bowden_unload_speed: 50
bowden_unload_accel: 80
# finda load/unload
finda_load_retry: 5
finda_load_length: 600
finda_unload_retry: 10
finda_unload_length: 30
finda_load_speed: 80
finda_unload_speed: 20
finda_load_accel: 50
finda_unload_accel: 50
# cut (in mmu3) length and other settings (not supported in MMU3-12x)
cut_filament_length = 20
cutting_edge_retract = 5
cut_stepper_current = 1.0
# cut (in extruder)
enable_filament_cutter = True
#extra_load_length = 22
extra_load_length =40 #JP
# --------------------------------------
# Selector Stepper Parameters
selector_speed = 35  # increasing this any further causes problems
selector_homing_speed = 20
selector_homing_speed_slow = 5
selector_accel = 200
# selector_positions =
#     73.500,  # 0
#     59.375,  # 1
#     45.250,  # 2
#     31.125,  # 3
#     17.000,  # 4
#     0.000   # park position
selector_positions =
    71.5,  # 0
    57.5,  # 1
    43.5,  # 2
    29.5,  # 3
    15.5,  # 4
    0.000   # park position
selector_homing_move_length = 76
# idler
idler_positions =
     5,   # 0
    20,   # 1
    35,   # 2
    50,   # 3
    65,   # 4
    85   # park position
idler_homing_move_lengths =  7, -95
idler_homing_speed = 100
idler_homing_accel = 80
idler_speed = 500
idler_accel = 800
# idler_unload_speed: 30
# pause values
pause_before_disabling_steppers: 0
pause_after_disabling_steppers: 0
pause_position = 230, 220, 10
# temperature
min_temp_extruder: 180
extruder_eject_temp: 200
# other options
number_of_tools: 5
enable_no_selector_mode: False
load_retry: 10
unload_retry: 10
tool_change_retry: 5
filament_switch_sensor_name: filament_switch_sensor switch_sensor
#filament_motion_sensor_name: filament_motion_sensor encoder_sensor #JP
debug: True

[pause_resume]
#recover_velocity: 50.

[gcode_macro CUT_FILAMENT_IN_EXTRUDER]
gcode:
   SET_PRESSURE_ADVANCE ADVANCE=0
   M83           # E relative
   G0 E-30 F6000 #Retract Filament fast before Cut
   CUTTER_ON     # cut on
   G4 P2000      # wait 2000 ms
   M83           # E relative
   G0 E-5 F500   # release blade
   CUTTER_OFF    # cut off
   #G4 P1000

[gcode_macro PROMPT_CLOSE_AND_RUN_COMMAND]
gcode:
    RESPOND TYPE=command MSG=action:prompt_end
    {params.COMMAND}
