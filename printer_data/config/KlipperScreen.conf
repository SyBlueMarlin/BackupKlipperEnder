# --- Button auf dem Startbildschirm (öffnet das 3x3 MMU3-Menü) ---
[menu __main mmu3]
name: MMU3
icon: filament
panel: menu
params: {"menu": "mmu3_grid"}

# --- Eigenes 3x3 Hauptmenü (bis zu 9 Buttons auf 1 Seite!) ---
[menu mmu3_grid g0]
name: T0 laden
icon: filament
method: printer.gcode.script
params: {"script":"MMU_LOAD GATE=0"}

[menu mmu3_grid g1]
name: T1 laden
icon: filament
method: printer.gcode.script
params: {"script":"MMU_LOAD GATE=1"}

[menu mmu3_grid g2]
name: T2 laden
icon: filament
method: printer.gcode.script
params: {"script":"MMU_LOAD GATE=2"}

[menu mmu3_grid g3]
name: T3 laden
icon: filament
method: printer.gcode.script
params: {"script":"MMU_LOAD GATE=3"}

[menu mmu3_grid g4]
name: T4 laden
icon: filament
method: printer.gcode.script
params: {"script":"MMU_LOAD GATE=4"}

[menu mmu3_grid unload]
name: Entladen
icon: arrow-up
method: printer.gcode.script
params: {"script":"MMU_UNLOAD"}

[menu mmu3_grid eject]
name: Eject (Auswurf)
icon: cancel
method: printer.gcode.script
params: {"script":"MMU_EJECT"}

[menu mmu3_grid home]
name: MMU Home
icon: home
method: printer.gcode.script
params: {"script":"MMU_HOME"}

[menu mmu3_grid motors]
name: Motoren aus
icon: motor-off
method: printer.gcode.script
params: {"script":"MMU_MOTORS_OFF"}
