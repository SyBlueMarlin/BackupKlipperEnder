# --- MMU3 Hauptmenü (4 Buttons) ---
[menu __main mmu3]
name: MMU3
icon: filament

[menu __main mmu3 load]
name: Laden
icon: arrow-down

[menu __main mmu3 eject]
name: Auswerfen
icon: cancel

[menu __main mmu3 unload]
name: Entladen
icon: arrow-up
method: printer.gcode.script
params: {"script":"MMU_UNLOAD"}

[menu __main mmu3 home]
name: MMU Home
icon: home
method: printer.gcode.script
params: {"script":"MMU_HOME"}

# --- Untermenü: Laden (3 Buttons + 1 Ordner = 4 Buttons) ---
[menu __main mmu3 load g0]
name: T0 laden
icon: filament
method: printer.gcode.script
params: {"script":"MMU_LOAD GATE=0"}

[menu __main mmu3 load g1]
name: T1 laden
icon: filament
method: printer.gcode.script
params: {"script":"MMU_LOAD GATE=1"}

[menu __main mmu3 load g2]
name: T2 laden
icon: filament
method: printer.gcode.script
params: {"script":"MMU_LOAD GATE=2"}

[menu __main mmu3 load more]
name: T3 / T4 laden
icon: arrow-right

# --- Untermenü: Laden T3 & T4 (2 Buttons) ---
[menu __main mmu3 load more g3]
name: T3 laden
icon: filament
method: printer.gcode.script
params: {"script":"MMU_LOAD GATE=3"}

[menu __main mmu3 load more g4]
name: T4 laden
icon: filament
method: printer.gcode.script
params: {"script":"MMU_LOAD GATE=4"}

# --- Untermenü: Auswerfen (3 Buttons + 1 Ordner = 4 Buttons) ---
[menu __main mmu3 eject all]
name: Aktuelles Eject
icon: cancel
method: printer.gcode.script
params: {"script":"MMU_EJECT"}

[menu __main mmu3 eject g0]
name: T0 Eject
icon: arrow-up
method: printer.gcode.script
params: {"script":"MMU_EJECT GATE=0"}

[menu __main mmu3 eject g1]
name: T1 Eject
icon: arrow-up
method: printer.gcode.script
params: {"script":"MMU_EJECT GATE=1"}

[menu __main mmu3 eject more]
name: T2 - T4 Eject
icon: arrow-right

# --- Untermenü: Auswerfen T2 - T4 (3 Buttons) ---
[menu __main mmu3 eject more g2]
name: T2 Eject
icon: arrow-up
method: printer.gcode.script
params: {"script":"MMU_EJECT GATE=2"}

[menu __main mmu3 eject more g3]
name: T3 Eject
icon: arrow-up
method: printer.gcode.script
params: {"script":"MMU_EJECT GATE=3"}

[menu __main mmu3 eject more g4]
name: T4 Eject
icon: arrow-up
method: printer.gcode.script
params: {"script":"MMU_EJECT GATE=4"}
