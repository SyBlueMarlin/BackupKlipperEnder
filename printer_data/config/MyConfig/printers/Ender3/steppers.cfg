# WARNING. DO NOT EDIT THIS FILE.
# To override settings from this file, you can copy and paste the relevant
# sections into your printer.cfg and change it there.

# Driver0
[stepper_x]
step_pin: x_step_pin
dir_pin: x_dir_pin
enable_pin: !x_enable_pin
microsteps: 16
rotation_distance: 40
endstop_pin: x_endstop_pin
position_endstop: 0
position_max: 200
homing_speed: 50

# Driver1
[stepper_y]
step_pin: y_step_pin
dir_pin: y_dir_pin
enable_pin: !y_enable_pin
microsteps: 16
rotation_distance: 40
endstop_pin: y_endstop_pin
position_endstop: 0
position_max: 200
homing_speed: 50

# Driver2
[stepper_z]
step_pin: z0_step_pin
dir_pin: z0_dir_pin
enable_pin: !z0_enable_pin
microsteps: 16
rotation_distance: 8
endstop_pin: probe: z_virtual_endstop
position_max: 200

# Driver3
# The Octopus only has 4 heater outputs which leaves an extra stepper
# This can be used for a second Z stepper, dual_carriage, extruder co-stepper,
# or other accessory such as an MMU
[stepper_z1] #JP
step_pin: z1_step_pin
dir_pin: z1_dir_pin
enable_pin: !z1_enable_pin
microsteps: 16
rotation_distance: 8

# Driver4
[extruder]
step_pin: e_step_pin
dir_pin: e_dir_pin
enable_pin: !e_enable_pin
microsteps: 16
rotation_distance: 21.828 #JP
nozzle_diameter: 0.600
filament_diameter: 1.750
heater_pin: e_heater_pin 
sensor_pin:  e_sensor_pin 
sensor_type: ATC Semitec 104NT-4-R025H42G #JP
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: -130
max_temp: 250

