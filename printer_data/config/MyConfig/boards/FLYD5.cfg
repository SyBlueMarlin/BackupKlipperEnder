  fan_part_cooling_pin=PC9,
  fan_toolhead_cooling_pin=PC8,
  fan_controller_board_pin=null,
# Bed heater
  heater_bed_heating_pin=PC7,
  heater_bed_sensor_pin=PC0,
  
