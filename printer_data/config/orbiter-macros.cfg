#====================================================================
# ORBITER 2.1 FILAMENT MACROS (LOAD / UNLOAD)
#====================================================================

[gcode_macro LOAD_FILAMENT]
description: Lädt Filament automatisch in den Orbiter 2.1
gcode:
    {% set EXTRUDER_TEMP = params.TEMP|default(220)|int %}
    
    SAVE_GCODE_STATE NAME=load_state
    M117 Filament wird geladen...
    
    # Prüfen ob der Extruder heiß genug ist
    {% if printer.extruder.temperature < EXTRUDER_TEMP %}
        M117 Heize Extruder auf {EXTRUDER_TEMP}C...
        M109 S{EXTRUDER_TEMP}
    {% endif %}

    M117 Ziehe Filament ein...
    G91
    G1 E50 F1200     # Schneller Einzug durch das Guide-Tube
    G1 E30 F300      # Verlangsamen vor der Schmelzzone
    G1 E25 F150      # Filament extrudieren/durchspülen
    G90
    
    M117 Filament erfolgreich geladen!
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
description: Wirft das Filament materialschonend aus
gcode:
    {% set EXTRUDER_TEMP = params.TEMP|default(220)|int %}
    
    SAVE_GCODE_STATE NAME=unload_state
    M117 Filament wird entladen...
    
    {% if printer.extruder.temperature < EXTRUDER_TEMP %}
        M117 Heize Extruder auf {EXTRUDER_TEMP}C...
        M109 S{EXTRUDER_TEMP}
    {% endif %}

    G91
    # Kleiner Extrusion-Push um Filament-Tip zu formen (verhindert Stringing im Getriebe)
    G1 E2 F300
    G1 E-10 F2000    # Schneller Rückzug aus der Schmelzzone
    G1 E-60 F1200    # Filament komplett aus dem Orbiter herausschieben
    G90
    
    M117 Filament entladen!
    RESTORE_GCODE_STATE NAME=unload_state
