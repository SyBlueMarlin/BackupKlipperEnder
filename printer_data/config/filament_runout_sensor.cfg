# [filament_switch_sensor toolhead_filament_sensor]
# pause_on_runout: True
# runout_gcode:
#     M117 Filament-Runout erkannt!
#     PAUSE
# insert_gcode:
#     M117 Filament eingeführt, starte Autoload...
#     FILAMENT_LOAD_INIT
# switch_pin: ^!toolboard:PB4 # Das '!' invertiert das Signal (oft nötig für v2.0)

[filament_switch_sensor my_filament_sensor]
#switch_pin: !ebb:PA3  # !ebb:PA15
switch_pin: ^!toolboard:PB4 # Das '!' invertiert das Signal (oft nötig für v2.0)
pause_on_runout: False
runout_gcode:
  G90  # set to absolute positioning
  SET_IDLE_TIMEOUT TIMEOUT=86400
  M300
  # marks the loaded gate empty, then continues with endless spool or runs
  # PAUSE, so no PAUSE here
  MMU_RUNOUT
  M117 Filament switch runout
  M118 Filament switch runout

[gcode_button filament_unload]
pin: ^!toolboard:PB3         # Pin des physischen Tasters am Sensor
release_gcode:               # Führt das Makro beim Loslassen des Tasters aus
    FILAMENT_UNLOAD_INIT
press_gcode:                 # Bleibt leer (Sicherheitsfunktion)
