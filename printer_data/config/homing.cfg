[homing_override]
axes: xyz
gcode:
  # Variablen definieren, um zu prüfen, welche Achse angefordert wurde
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}

  # Z-Hop vor dem Homing (Sicherheit gegen Kratzer)
  SET_KINEMATIC_POSITION Z=0
  G1 Z5 F600

  # X Homing ausführen, wenn "All" oder "X" gewählt wurde
  {% if home_all or 'X' in params %}
    G28 X
  {% endif %}

  # Y Homing ausführen, wenn "All" oder "Y" gewählt wurde
  {% if home_all or 'Y' in params %}
    G28 Y
  {% endif %}

  # Z Homing ausführen (fährt vorab zur sicheren Bettmitte)
  {% if home_all or 'Z' in params %}
    G1 X110 Y110 F6000  # Passe diese Koordinaten an deine Bettmitte an!
    G28 Z
  {% endif %}
